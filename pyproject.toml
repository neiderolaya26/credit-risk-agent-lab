[project]
name = "credit-risk-agent-lab"
version = "1.2.0"
description = "Sistema de decisión de crédito de punta a punta con datos públicos de Lending Club: modelos de riesgo, inferencia causal y un agente de IA auditado."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Neider Olaya" }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# Solo errores reales (sintaxis, nombres sin definir, imports y variables sin usar); el estilo no se revisa.
select = ["E9", "F"]
